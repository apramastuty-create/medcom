<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Verifikasi Sertifikat</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#5c6b80;--ok:#0f9d58;--okbg:#e6f6ee;--no:#d93025;--nobg:#fdecea;--bd:#e1e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#16202f;--tx:#e8eef8;--mut:#93a3b8;--okbg:#10301f;--nobg:#3a1612;--bd:#26344a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 18px;font-weight:600}
.ic{width:84px;height:84px;margin:0 auto 12px}
.ic circle{fill:none;stroke-width:5;stroke-dasharray:226;stroke-dashoffset:226;animation:d .7s ease forwards}
.ic path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .5s .5s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
.ok .ic *{stroke:var(--ok)}.no .ic *{stroke:var(--no)}
.st{font-size:22px;font-weight:700;margin:0 0 4px}.ok .st{color:var(--ok)}.no .st{color:var(--no)}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
dl{margin:0;text-align:left;border-top:1px solid var(--bd)}
.r{padding:11px 0;border-bottom:1px solid var(--bd)}dt{font-size:12px;color:var(--mut);margin-bottom:2px}dd{margin:0;font-weight:600;font-size:15px;word-break:break-word}
.badge{display:inline-block;margin-top:16px;padding:6px 12px;border-radius:99px;font-size:12px}.ok .badge{background:var(--okbg);color:var(--ok)}.no .badge{background:var(--nobg);color:var(--no)}
form{display:flex;gap:8px;margin-top:18px}input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;text-transform:uppercase;letter-spacing:.08em}
button{padding:12px 16px;border:0;border-radius:10px;background:#1f5fbf;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.ft{margin-top:20px;font-size:12px;color:var(--mut)}
</style></head><body><main class="card" id="c"></main>

const c=document.getElementById("c"),enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const un=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const CHECK='<svg class="ic" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><path d="M26 43l11 11 21-23"/></svg>';
const CROSS='<svg class="ic" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><path d="M30 30l24 24M54 30L30 54"/></svg>';
const FORM='<form id="f"><input id="i" placeholder="Masukkan ID, mis. A7K9-2QX4" maxlength="9" autocomplete="off"><button>Cek</button></form>';
async function lookup(id){
  id=id.toUpperCase().replace(/\s/g,"");
  const h=hex(await crypto.subtle.digest("SHA-256",enc.encode(id)));
  const r=RECS[h]; if(!r) return null;
  try{
    const [iv,ct]=r.split(".");
    const km=await crypto.subtle.importKey("raw",enc.encode(id),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un(iv)},k,un(ct))));
  }catch(e){return null}
}
function show(d,id){
  const now=new Date().toLocaleString("id-ID",{dateStyle:"long",timeStyle:"short"});
  c.className="card "+(d?"ok":"no");
  c.innerHTML=(d?`<h1>Verifikasi Sertifikat</h1>${CHECK}<p class="st">Sertifikat Terverifikasi</p><p class="sub">Sertifikat ini asli dan tercatat dalam sistem.</p>
  <dl><div class="r"><dt>Nama Penerima</dt><dd>${esc(d.nama)}</dd></div><div class="r"><dt>Nomor Sertifikat</dt><dd>${esc(d.no)}</dd></div>
  <div class="r"><dt>Kegiatan</dt><dd>${esc(d.keg)}</dd></div><div class="r"><dt>Periode</dt><dd>${esc(d.tgl)}</dd></div><div class="r"><dt>Nilai</dt><dd>${esc(d.nilai)}</dd></div></dl>
  <span class="badge">Diperiksa pada ${now}</span>`
  :`<h1>Verifikasi Sertifikat</h1>${CROSS}<p class="st">Tidak Ditemukan</p><p class="sub">${id?"ID tidak terdaftar. Pastikan QR atau ID yang dimasukkan benar.":"Masukkan ID verifikasi pada sertifikat."}</p>`)+FORM+'<p class="ft">Sistem Verifikasi Sertifikat Digital</p>';
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const v=document.getElementById("i").value.trim();if(v)location.search="?id="+encodeURIComponent(v)};
}
(async()=>{
  const id=new URLSearchParams(location.search).get("id");
  if(!id){show(null,"");c.querySelector(".st").textContent="Verifikasi Sertifikat";c.className="card";return}
  show(await lookup(id),id);
})();
</script></body></html>
